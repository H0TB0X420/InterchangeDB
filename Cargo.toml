[workspace]
# The root package is the workspace root; `testkit` is the shared test/bench
# support crate (config registry, matrix macros, fault injection, workloads).
# `fuzz/` is cargo-fuzz's own nested workspace and must be excluded so Cargo
# doesn't try to absorb it.
members = [".", "crates/idb-core", "crates/idb-storage", "crates/idb-wal", "crates/idb-txn", "crates/idb-sql", "testkit"]
exclude = ["fuzz"]

[package]
name = "interchangedb"
version = "0.1.0"
edition = "2021"
authors = ["Erich"]
description = "A database with runtime-swappable buffer pool eviction policies"
license = "MIT"

[lib]
name = "interchangedb"
path = "src/lib.rs"

[dependencies]
idb-core = { path = "crates/idb-core" }
idb-storage = { path = "crates/idb-storage" }
idb-wal = { path = "crates/idb-wal" }
idb-txn = { path = "crates/idb-txn" }
idb-sql = { path = "crates/idb-sql" }
thiserror = "1.0"
parking_lot = "0.12"
crc32fast = "1.3"
lru = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sqlparser = "0.50"
shuttle = { version = "0.9.1", optional = true }

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"
tempfile = "3.10"
goldenscript = "0.7"
test_each_file = "0.3"
testkit = { path = "testkit" }
sqllogictest = "0.28"
futures = "0.3"

# Integration tests are two explicit harnesses (build-times P2): every
# former tests/*.rs file was its own binary, so a one-line src/ edit
# relinked 88 of them. Subdirectory placement ends Cargo's auto-discovery;
# these two entries are the only integration-test binaries.
[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "stress"
path = "tests/stress/main.rs"

# Criterion micro-benches are two explicit harnesses (build-times P3);
# group/function ids are preserved verbatim so criterion result paths and
# benches/RESULTS.md references stay valid. `eviction_policies` (bespoke
# summary-mode main) and the seven `engine_*` experiment harnesses (custom
# mains writing CSVs) stay standalone — merging custom mains is a CLI
# redesign, out of scope for a no-semantic-change phase.
[[bench]]
name = "engine_bench"
path = "benches/engine_bench/main.rs"
harness = false

[[bench]]
name = "sql_bench"
path = "benches/sql_bench/main.rs"
harness = false

[[bench]]
name = "eviction_policies"
harness = false

[[bench]]
name = "bpm_bench"
harness = false

[[bench]]
name = "engine_crossover"
harness = false

[[bench]]
name = "engine_steady_state"
harness = false

[[bench]]
name = "engine_range_scan"
harness = false

[[bench]]
name = "engine_amplification"
harness = false

[[bench]]
name = "engine_space_amplification"
harness = false

[[bench]]
name = "engine_zipfian_updates"
harness = false

[[bench]]
name = "engine_ycsb"
harness = false

[lints.clippy]
all = "warn"

[features]
shuttle = ["dep:shuttle", "idb-core/shuttle"]

[profile.dev]
# Full debuginfo dominates ld64 link time and we rarely step-debug; line
# tables keep panic locations and test-failure backtraces legible at a
# fraction of the link cost. Measured rationale: docs/plan-build-times.md.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies compile once and then run inside every test; optimizing them
# pays back on every proptest/goldenscript run. Wildcard excludes workspace
# members, so interchangedb/testkit iteration stays fast-compiling.
opt-level = 2
debug = false

[profile.dev.build-override]
# Proc macros (serde_derive, thiserror) execute at compile time; optimizing
# them speeds up every build that expands them.
opt-level = 3
