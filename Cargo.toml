[package]
name = "interchangedb"
version = "0.1.0"
edition = "2021"
authors = ["Erich"]
description = "A database with runtime-swappable buffer pool eviction policies"
license = "MIT"

[lib]
name = "interchangedb"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
parking_lot = "0.12"
crc32fast = "1.3"
lru = "0.12"
serde = { version = "1", features = ["derive"] }
bincode = "1"

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"
tempfile = "3.10"
goldenscript = "0.7"
test_each_file = "0.3"

[[bench]]
name = "eviction_policies"
harness = false

[[bench]]
name = "bpm_bench"
harness = false

[[bench]]
name = "btree_bench"
harness = false

[[bench]]
name = "lsm_bench"
harness = false

[[bench]]
name = "txn_bench"
harness = false

[[bench]]
name = "engine_crossover"
harness = false

[[bench]]
name = "engine_steady_state"
harness = false

[[bench]]
name = "engine_range_scan"
harness = false

[[bench]]
name = "engine_amplification"
harness = false

[[bench]]
name = "engine_space_amplification"
harness = false

[[bench]]
name = "engine_zipfian_updates"
harness = false

[[bench]]
name = "engine_ycsb"
harness = false

[lints.clippy]
all = "warn"
