[workspace]
# The root package is the workspace root; `testkit` is the shared test/bench
# support crate (config registry, matrix macros, fault injection, workloads).
# `fuzz/` is cargo-fuzz's own nested workspace and must be excluded so Cargo
# doesn't try to absorb it.
members = [".", "testkit"]
exclude = ["fuzz"]

[package]
name = "interchangedb"
version = "0.1.0"
edition = "2021"
authors = ["Erich"]
description = "A database with runtime-swappable buffer pool eviction policies"
license = "MIT"

[lib]
name = "interchangedb"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
parking_lot = "0.12"
crc32fast = "1.3"
lru = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sqlparser = "0.50"
shuttle = { version = "0.9.1", optional = true }

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"
tempfile = "3.10"
goldenscript = "0.7"
test_each_file = "0.3"
testkit = { path = "testkit" }

[[bench]]
name = "eviction_policies"
harness = false

[[bench]]
name = "bpm_bench"
harness = false

[[bench]]
name = "btree_bench"
harness = false

[[bench]]
name = "lsm_bench"
harness = false

[[bench]]
name = "txn_bench"
harness = false

[[bench]]
name = "engine_crossover"
harness = false

[[bench]]
name = "engine_steady_state"
harness = false

[[bench]]
name = "engine_range_scan"
harness = false

[[bench]]
name = "engine_amplification"
harness = false

[[bench]]
name = "engine_space_amplification"
harness = false

[[bench]]
name = "engine_zipfian_updates"
harness = false

[[bench]]
name = "engine_ycsb"
harness = false

[[bench]]
name = "config_matrix"
harness = false

[lints.clippy]
all = "warn"

[features]
shuttle = ["dep:shuttle"]
